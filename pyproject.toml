[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fdsvis"
version = "1.1.0"
description = "Interactive visualizer for FDS (Fire Dynamics Simulator) slice-file ensembles"
requires-python = ">=3.9"
dependencies = [
    "PyQt5==5.15.*",
    "matplotlib>=3.8",
    "numpy>=1.26",
    "scikit-learn>=1.3",
    "scipy>=1.11",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[tool.setuptools]
package-dir = { "" = "src" }
packages = ["fds", "fds.slice", "analytics", "cinema"]
py-modules = [
    "analytics_panel",
    "auto_summary",
    "browser",
    "config",
    "data_provider",
    "export",
    "load_data",
    "main",
    "main_window",
    "manifest",
    "scenario_store",
    "schematic",
    "simulation_controller",
    "slice_key",
    "summary_stats",
    "theme",
    "time_controller",
    "views",
    "widgets",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
